<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glowing Orb Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes signalMove {
        0% { cx: 220; cy: 350; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 980; cy: 350; opacity: 0; }
      }
      .orb-1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .orb-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 300px;
      }
      .flow-line {
        stroke-dasharray: 6, 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .signal-dot {
        animation: signalMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .badge-float-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .badge-float-2 {
        animation: floatSlow 6s ease-in-out infinite 1s;
      }
      .badge-float-3 {
        animation: floatSlow 5.5s ease-in-out infinite 2s;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Placed deep behind everything) -->
  <g>
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#818cf8" filter="url(#glow)" />
    <circle class="orb-1" cx="600" cy="380" r="120" fill="#c084fc" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Flowing Network Connection Line across bottom -->
  <g opacity="0.6">
    <path class="flow-line" d="M 120 350 L 1080 350" stroke="#38bdf8" stroke-width="2" />
    <circle class="signal-dot" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Floating Dynamic Feature Badges (Positioned cleanly below title so text is never obscured) -->
  <g class="badge-float-1" transform="translate(180, 260)">
    <rect width="190" height="46" rx="23" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="25" cy="23" r="8" fill="#38bdf8" />
    <text class="body-text" x="42" y="28" fill="#e2e8f0" font-size="14" font-weight="600">ITIL 4 &amp; Ticketing</text>
  </g>

  <g class="badge-float-2" transform="translate(410, 260)">
    <rect width="180" height="46" rx="23" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="25" cy="23" r="8" fill="#818cf8" />
    <text class="body-text" x="42" y="28" fill="#e2e8f0" font-size="14" font-weight="600">CMDB &amp; ITAM</text>
  </g>

  <g class="badge-float-3" transform="translate(630, 260)">
    <rect width="210" height="46" rx="23" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="25" cy="23" r="8" fill="#c084fc" />
    <text class="body-text" x="42" y="28" fill="#e2e8f0" font-size="14" font-weight="600">AI Service Catalogs</text>
  </g>

  <g class="badge-float-1" transform="translate(880, 260)">
    <rect width="170" height="46" rx="23" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" />
    <circle cx="25" cy="23" r="8" fill="#34d399" />
    <text class="body-text" x="42" y="28" fill="#e2e8f0" font-size="14" font-weight="600">Self-Hosted Ops</text>
  </g>

  <!-- Foreground Title and Subtitle (Ensured high contrast, never occluded) -->
  <g transform="translate(600, 115)">
    <!-- Small Category Pill -->
    <rect x="-110" y="-55" width="220" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text class="body-text" x="0" y="-35" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE ITSM &amp; OPS</text>

    <!-- Main Title -->
    <text class="title-text" x="0" y="25" text-anchor="middle" fill="url(#accentGrad)" font-size="46">Awesome IT Service Desk &amp; ITSM</text>

    <!-- Subtitle -->
    <text class="body-text" x="0" y="65" text-anchor="middle" fill="#94a3b8" font-size="17" font-weight="400">
      Curated Guide to Enterprise SaaS &amp; Sovereign Open-Source ITIL Platforms
    </text>
  </g>
</svg>
